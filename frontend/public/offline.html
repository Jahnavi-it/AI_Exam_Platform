<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline — Exam Platform</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6f9;
      color: #1f2530;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 40px 32px;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(20, 30, 60, 0.08);
    }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #6b7280; font-size: 14px; margin: 0 0 20px; }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:40px;">📡</div>
    <h1>You're offline</h1>
    <p>Can't reach the exam server right now. Please check your internet connection and try again. Never close this app during a live exam without connectivity.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
